[package]
name = "plp-math-hybrid"
version = "0.1.0"
description = "PLP Math Content Hybrid Android Application"
authors = ["PLP Engineering Team"]
edition = "2021"

[lib]
name = "plp_math_hybrid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

